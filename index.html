<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taccuino di Viaggio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one quiet screen — slim header, the open notebook centred on a desk, a time scrubber underneath. */
:root {
  --desk: #e5e3e1;
  --desk-2: #d9d6d4;
  --text: #29282d;
  --muted: #736f78;
  --line: rgba(41, 40, 45, .12);
  --chip: rgba(255, 255, 255, .62);
  --accent: #d9862c;           /* sunset amber, used only on the time control */
  --cover: #2e3846;            /* slate linen, borrowed from the sea */
  --paper: #fbf9f5;
  --edge-a: #e4e0d8;
  --edge-b: #f6f3ee;
  --dusk: 0;                   /* 0..1, driven by the sunset */
  --f-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #18191d; --desk-2: #101114; --text: #ebe7e1; --muted: #9b97a1;
    --line: rgba(235, 231, 225, .12); --chip: rgba(255, 255, 255, .06); --accent: #f0a04b;
    --cover: #3a4555; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #18191d; --desk-2: #101114; --text: #ebe7e1; --muted: #9b97a1;
  --line: rgba(235, 231, 225, .12); --chip: rgba(255, 255, 255, .06); --accent: #f0a04b;
  --cover: #3a4555; color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--desk);
  color: var(--text);
  font-family: var(--f-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
body::after {               /* the room dims a little as the sun goes down */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 90% at 50% 45%, transparent 40%, rgba(30, 24, 60, .22) 100%), rgba(52, 40, 90, .10);
  opacity: var(--dusk);
  transition: opacity .3s linear;
}
.app {
  position: relative; z-index: 1;
  height: 100%;
  display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 18px;
  box-sizing: border-box;
}

/* ---------- header */
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1180px; width: 100%; margin: 0 auto; }
.tools { display: flex; gap: 6px; }
.icon-btn {
  appearance: none; border: 1px solid var(--line); background: var(--chip); color: var(--text);
  width: 38px; height: 38px; border-radius: 999px; display: grid; place-items: center; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: transform .15s ease, background .2s;
}
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn:focus-visible, .scrub input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn[aria-pressed="true"] .off, .icon-btn[aria-pressed="false"] .on { display: none; }

/* ---------- desk + notebook */
.desk { display: grid; place-items: center; min-height: 0; position: relative; }
.scroller { width: 100%; display: grid; place-items: center; }
.book {
  --pw: min(calc((100vw - 120px) / 2), calc((100dvh - 210px) * .6923), 540px);
  position: relative; display: flex;
  animation: arrive .9s cubic-bezier(.2, .8, .2, 1) both;
}
@keyframes arrive { from { transform: translateY(14px) scale(.985); opacity: 0; } }
.book::before {             /* linen cover peeking out from under the pages */
  content: ""; position: absolute; inset: -11px -15px -13px; border-radius: 7px; z-index: -1;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 2px),
    linear-gradient(90deg, rgba(0,0,0,.18), transparent 8%, transparent 46%, rgba(0,0,0,.35) 50%, transparent 54%, transparent 92%, rgba(0,0,0,.18)),
    var(--cover);
  box-shadow:
    0 1px 0 rgba(255,255,255,.08) inset,
    0 2px 3px rgba(10, 12, 20, .25),
    0 22px 40px -12px rgba(10, 12, 25, .45),
    0 60px 90px -40px rgba(10, 12, 25, .45);
}
.page {
  position: relative; width: var(--pw); aspect-ratio: 900 / 1300; max-width: 100%;
  background: var(--paper) url("assets/paper.webp") repeat;
  background-size: 300px; background-blend-mode: multiply;
  isolation: isolate; overflow: hidden;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.page.left  { border-radius: 4px 1px 1px 4px; box-shadow: -1px 1px 0 var(--edge-a), -2px 2px 0 var(--edge-b), -3px 3px 0 var(--edge-a), -4px 4px 0 var(--edge-b), -5px 5px 0 #cfcac1, -6px 6px 6px rgba(0,0,0,.12); }
.page.right { border-radius: 1px 4px 4px 1px; box-shadow:  1px 1px 0 var(--edge-a),  2px 2px 0 var(--edge-b),  3px 3px 0 var(--edge-a),  4px 4px 0 var(--edge-b),  5px 5px 0 #cfcac1,  6px 6px 6px rgba(0,0,0,.12); }
.page canvas { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; display: block; }
.page .light { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; }
.page.left .light {
  background:
    linear-gradient(270deg, rgba(60,50,40,.30) 0, rgba(60,50,40,.10) 2.2%, rgba(255,255,255,0) 7%, rgba(0,0,0,0) 100%),
    linear-gradient(90deg, rgba(60,50,40,.07) 0, transparent 4%),
    radial-gradient(140% 100% at 70% 40%, transparent 60%, rgba(60,50,40,.07));
}
.page.right .light {
  background:
    linear-gradient(90deg, rgba(60,50,40,.30) 0, rgba(60,50,40,.10) 2.2%, rgba(255,255,255,0) 7%, rgba(0,0,0,0) 100%),
    linear-gradient(270deg, rgba(60,50,40,.07) 0, transparent 4%),
    radial-gradient(140% 100% at 30% 40%, transparent 60%, rgba(60,50,40,.07));
}
.page .sheen { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }
.page.left .sheen  { background: linear-gradient(270deg, transparent 3%, rgba(255,255,255,.35) 7%, transparent 14%); }
.page.right .sheen { background: linear-gradient(90deg, transparent 3%, rgba(255,255,255,.35) 7%, transparent 14%); }
.stitches { position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; pointer-events: none; z-index: 3; }
.stitches i { position: absolute; left: 2px; width: 2px; height: 3.4%; border-radius: 2px; background: linear-gradient(90deg, #d9d4ca, #fffdf8 60%, #cfc9be); box-shadow: 0 0 0 .5px rgba(0,0,0,.08); }
.stitches i::before, .stitches i::after { content: ""; position: absolute; left: 0; width: 2px; height: 2px; border-radius: 50%; background: rgba(40,35,30,.35); }
.stitches i::before { top: -2px; } .stitches i::after { bottom: -2px; }

.page.left canvas { cursor: default; }
.page.right canvas { touch-action: pan-x; }
.page.right canvas.sky { cursor: ns-resize; }
.page.right canvas.sea { cursor: pointer; }

/* small note pill (popsicle finished) */
.say {
  position: absolute; z-index: 5; pointer-events: none;
  transform: translate(-50%, -100%) translateY(-6px);
  background: var(--text); color: var(--desk);
  font: 500 12px/1 var(--f-ui); padding: 7px 10px 7px 9px; border-radius: 999px; white-space: nowrap;
  display: flex; gap: 7px; align-items: center;
  box-shadow: 0 6px 18px rgba(0,0,0,.18);
  animation: pill 2.6s ease both;
}
.say b { font: italic 400 16px/1 var(--f-display); letter-spacing: .01em; }
.say span { font-family: var(--f-mono); font-size: 10.5px; opacity: .7; letter-spacing: .04em; }
@keyframes pill { 0% { opacity: 0; transform: translate(-50%, -100%) translateY(2px); } 10%, 82% { opacity: 1; transform: translate(-50%, -100%) translateY(-6px); } 100% { opacity: 0; transform: translate(-50%, -100%) translateY(-10px); } }

/* ---------- footer: time scrubber + hints */
footer { display: grid; gap: 10px; justify-items: center; max-width: 560px; width: 100%; margin: 0 auto; }
.scrub { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; }
.scrub .lbl { font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.scrub input {
  -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; margin: 0;
}
.scrub input::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, #f3c34c, #e48a3a 45%, #b45b78 72%, #46507a); }
.scrub input::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, #f3c34c, #e48a3a 45%, #b45b78 72%, #46507a); }
.scrub input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border-radius: 50%; background: var(--paper); border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.scrub input::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--paper); border: 2px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.clock { font: 500 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--text); min-width: 5.2ch; text-align: right; }
.hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; transition: opacity .6s; }
.hints li { font: 400 12px/1 var(--f-ui); color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); }
.hints li strong { color: var(--text); font-weight: 500; }
.dots { display: none; gap: 6px; }
.dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; border: 0; background: var(--muted); opacity: .35; cursor: pointer; }
.dots button[aria-current="true"] { opacity: 1; background: var(--text); }


/* ---------- pages, slots and the turning leaf */
.book { perspective: 2800px; }
.slot { position: relative; width: var(--pw); aspect-ratio: 900 / 1300; max-width: 100%; }
.slot > .page, .face > .page { position: absolute; inset: 0; width: 100%; height: 100%; }
.curl { position: absolute; left: -8%; right: -8%; top: -16%; bottom: -16%; width: 116%; height: 132%; pointer-events: none; z-index: 6; }
.cast { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 3; opacity: 0; width: var(--spread, 60px); }
.cast.on-right { left: var(--edge, 50%); background: linear-gradient(90deg, rgba(30, 24, 20, .34), rgba(30, 24, 20, .1) 40%, transparent); }
.cast.on-left { right: var(--edge, 50%); background: linear-gradient(270deg, rgba(30, 24, 20, .34), rgba(30, 24, 20, .1) 40%, transparent); }
.corner { position: absolute; top: 0; bottom: 0; width: 26px; z-index: 5; cursor: grab; touch-action: none; }
.corner.right { right: -8px; } .corner.left { left: -8px; }
.corner::before { content: ""; position: absolute; top: 0; bottom: 0; width: 18px; opacity: 0; transition: opacity .25s; }
.corner.right::before { right: 8px; background: linear-gradient(270deg, rgba(40, 32, 26, .16), transparent); }
.corner.left::before { left: 8px; background: linear-gradient(90deg, rgba(40, 32, 26, .16), transparent); }
.corner:hover::before { opacity: 1; }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
.pager .icon-btn:disabled { opacity: .3; cursor: default; transform: none; }
.where { display: grid; justify-items: center; gap: 4px; min-width: 14ch; }
.where .place { font: italic 400 19px/1.1 var(--f-display); text-align: center; text-wrap: balance; }
.where .count { font: 500 10.5px/1 var(--f-mono); letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; }
header { justify-content: flex-end; }

/* ---------- phones: slide between the two pages */
@media (max-width: 760px) {
    .scroller {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    width: 100vw; padding-block: 20px 26px;
  }
  .scroller::-webkit-scrollbar { display: none; }
  .book { --pw: min(calc(100vw - 64px), calc((100dvh - 250px) * .6923)); margin-inline: calc((100vw - var(--pw)) / 2); flex: none; }
  .slot { scroll-snap-align: center; } .corner { display: none; }
  .curl { left: -4%; right: -4%; width: 108%; }
  .dots { display: flex; }
  .hints li:nth-child(n+3) { display: none; }
  .where .place { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { .book { animation: none; } .say { animation-duration: .01s; animation-delay: 2.5s; } }
</style>

<div class="app">
  <header>
    <div class="tools">
      <button class="icon-btn" id="play" aria-pressed="true" aria-label="Pause the sunset" title="Pause the sunset">
        <svg class="on" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10-6.8c.6-.4.6-1.2 0-1.6l-10-6.8C8.9 3.9 8 4.4 8 5.2z"/></svg>
      </button>
      <button class="icon-btn" id="sound" aria-pressed="false" aria-label="Turn sound on" title="Sound">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.2 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </header>

  <main class="desk">
    <div class="scroller" id="scroller">
      <div class="book" id="book">
        <div class="slot left" id="slotL"></div>
        <div class="stitches" aria-hidden="true"><i style="top:9%"></i><i style="top:30%"></i><i style="top:51%"></i><i style="top:72%"></i><i style="top:90%"></i></div>
        <div class="slot right" id="slotR"></div>
        <div class="cast" id="cast" aria-hidden="true"></div>
        <canvas class="curl" id="curl" aria-hidden="true"></canvas>
        <div class="corner left" id="cornerL" title="Drag to turn back" aria-hidden="true"></div>
        <div class="corner right" id="cornerR" title="Drag to turn the page" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <footer>
    <div class="dots" id="dots"><button aria-label="Show the left page" aria-current="false"></button><button aria-label="Show the right page" aria-current="true"></button></div>
    <div class="scrub" id="scrubRow">
      <span class="lbl">Golden hour</span>
      <input id="time" type="range" min="0" max="1000" value="0" aria-label="Time of evening">
      <span class="clock" id="clock">19:58</span>
    </div>
    <nav class="pager" aria-label="Pages">
      <button class="icon-btn" id="prev" aria-label="Previous pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
      <div class="where"><span class="place" id="place">Rome, Italy</span><span class="count" id="count">1 / 7</span></div>
      <button class="icon-btn" id="next" aria-label="Next pages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"/></svg></button>
    </nav>
    <ul class="hints" id="hints"></ul>
  </footer>
</div>

<script src="app.js"></script>
